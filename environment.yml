name: dl-sandbox
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.11

  # Core Deep Learning (installed via pip for latest version with MPS support)
  # - pytorch::pytorch>=2.0.0
  # - pytorch::torchvision
  # - pytorch::torchaudio

  # Scientific Computing & Data Manipulation
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scipy

  # Visualization
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - plotly

  # Graph Processing & Visualization
  - networkx>=3.0

  # Jupyter Environment
  - jupyter
  - jupyterlab
  - ipywidgets
  - notebook

  # Machine Learning Utilities
  - scikit-learn>=1.3.0

  # Progress & Utilities
  - tqdm
  - tensorboard

  # Pip packages (not available in conda or better from pip)
  - pip
  - pip:
    # PyTorch (via pip for latest version with security fixes)
    - torch>=2.6.0
    - torchvision
    - torchaudio

    # Hugging Face Ecosystem (for transformers/LLM work)
    - transformers>=4.30.0
    - tokenizers>=0.13.0
    - datasets>=2.14.0
    - accelerate>=0.20.0
    - evaluate  # Hugging Face evaluation metrics
    - rouge_score  # ROUGE metric for summarization

    # Additional utilities
    - sentencepiece  # for tokenization
    - tiktoken  # OpenAI's tokenizer
    - einops  # tensor operations
    - wandb  # experiment tracking (optional)

    # Graph Machine Learning
    - torch-geometric  # Graph Neural Networks with PyTorch
    - dgl  # Deep Graph Library (alternative GNN framework)
    - sentence-transformers  # Pre-trained text embeddings for hybrid models

    # Code quality (optional but recommended)
    - black  # code formatting
    - pylint  # linting
