name: dl-sandbox
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.11

  # Core Deep Learning
  - pytorch::pytorch>=2.0.0
  - pytorch::torchvision
  - pytorch::torchaudio

  # Scientific Computing & Data Manipulation
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scipy

  # Visualization
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - plotly

  # Jupyter Environment
  - jupyter
  - jupyterlab
  - ipywidgets
  - notebook

  # Machine Learning Utilities
  - scikit-learn>=1.3.0

  # Progress & Utilities
  - tqdm
  - tensorboard

  # Pip packages (not available in conda or better from pip)
  - pip
  - pip:
    # Hugging Face Ecosystem (for transformers/LLM work)
    - transformers>=4.30.0
    - tokenizers>=0.13.0
    - datasets>=2.14.0
    - accelerate>=0.20.0

    # Additional utilities
    - sentencepiece  # for tokenization
    - tiktoken  # OpenAI's tokenizer
    - einops  # tensor operations
    - wandb  # experiment tracking (optional)

    # Code quality (optional but recommended)
    - black  # code formatting
    - pylint  # linting
